# tmux for the web UI's terminal pane. Read only by the `-L aa-web` server that
# bin/aa-terminal.sh starts, so nothing here touches the agent-anywhere daemon's own session
# on the default server.

# The pane already has a header above it with the topic name and a way back, so tmux's status
# bar is a second, louder copy of information the page is already showing — and on a phone it
# is one of about fifty rows. `set -g status on` here if you want it back.
set -g status off

# Scrolling. Without this there is no way to reach the scrollback from a touchscreen at all:
# copy mode is prefix-[, and a phone keyboard has no Ctrl. The cost is that selecting text
# with a mouse now needs Shift held down, which is the usual tmux-in-a-browser trade.
set -g mouse on

# A terminal pane people will scroll back through, on a machine where memory is not the
# constraint. The default 2000 lines is roughly one `npm test`.
set -g history-limit 50000

# What ttyd actually renders. Left at the default the shell is told "screen", and programs
# that ask about colour capability take the conservative answer.
set -g default-terminal "tmux-256color"

# Escape-key latency. The default 500ms is there to disambiguate escape sequences on a slow
# serial line; over a WebSocket it is just half a second of an unresponsive Esc in every TUI
# and vim-mode prompt, which is exactly what this pane exists to run.
set -g escape-time 10
