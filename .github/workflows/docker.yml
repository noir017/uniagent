# 编译 amd64 / arm64 镜像并发布到 GitHub Packages（GHCR）。
#
# 触发：推送到 main（纯文档改动除外）自动跑；也可在 Actions 页手动 Run workflow。
#
# 拉镜像：
#   docker pull ghcr.io/noir017/uniagent:latest        # main 最新
#   docker pull ghcr.io/noir017/uniagent:sha-<短 sha>  # 钉死某次提交
#
# 部署侧（docker-compose.yml）已经直接用 image: ghcr.io/noir017/uniagent:latest，
# 不再本地 build —— 更新就是 push main → 等本 workflow 绿 → 目标机
# docker compose pull && docker compose up -d。
#
# 仓库 Actions 权限需允许 GITHUB_TOKEN 写 Packages。
# 第一次推送后，到仓库右侧 Packages 把包公开（仓库本身是公开的）。

name: Docker

on:
  push:
    branches: [main]
    # 只改文档不重建：这个镜像单架构要十几分钟，两架构更久。
    # 镜像内容只取决于 Dockerfile、entrypoint.sh 与 bin/（会被 COPY 进去），
    # 其余文件（compose、ua/uniagent 包装脚本、ssh/teleport 配置）都是宿主侧的，不进镜像。
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      # 宿主侧的文件（上面那段列的那些）：只有 Dockerfile / entrypoint.sh / bin/
      # 会进镜像，改这些等两架构重编一遍纯属白等。
      - 'uniagent'
      - 'ua'
      - 'docker-compose.yml'
      - 'ssh/**'
      - 'teleport/**'
  workflow_dispatch:
  # 供 bump-agent-anywhere.yml 用 `jobs.<id>.uses` 复用。
  #
  # 为什么不让 bump 那边推 main、靠上面的 push 触发：**用 GITHUB_TOKEN 推出去的
  # commit 不会再触发任何 workflow**（GitHub 为防死循环的明文限制）。bump 推完就
  # 没人构建了，看起来"成功"但 GHCR 上什么都没变。走 workflow_call 则全程只用
  # GITHUB_TOKEN，不必为了触发而引入 PAT 或 deploy key。
  workflow_call:
    inputs:
      ref:
        description: '要构建的 commit（留空 = 触发本次运行的那个）'
        required: false
        type: string
        default: ''

concurrency:
  # 字面量 docker- 而不是 ${{ github.workflow }}：被 workflow_call 复用时
  # github.workflow 是**调用方**的名字（Bump agent-anywhere），分组就和 push 触发
  # 的那次不一样，两条路会并发去抢同一个 latest tag。钉死字面量让它们共用一个组。
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    outputs:
      # 矩阵里两个 job 都会写这个 output，后完成的覆盖先完成的 —— 两边算出来的值
      # 完全相同（同一个 ref 的 HEAD），所以覆盖无所谓。
      short_sha: ${{ steps.built.outputs.short_sha }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 各架构用原生 runner，避开 QEMU。本镜像 apt 包多、还要装 Node/Go/多个
          # npm CLI，模拟会极慢（小时级）。arm64 runner 对公开仓库免费。
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 被复用时必须显式收 ref。调用方是 schedule / workflow_dispatch 事件，
          # 它的 github.sha 是**运行开始那一刻**的 main HEAD —— 也就是 bump 那个
          # commit 之前的状态，用默认值 checkout 会构建出一个"没升级"的镜像，
          # 而且全程绿灯。
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve built commit
        id: built
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Image name
        run: echo "IMAGE=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # scope 按架构分开，避免 amd64 和 arm64 互相覆盖。
          # Dockerfile 刻意把 Go / sshd / gh 拆成独立末层，缓存命中后改这些只重建一层。
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          # PR 只把缓存写回 GHA，不往 Packages 推。
          # 其它事件按 digest 推，tag 留给 merge job 合成多架构清单。
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}
          provenance: false
          sbom: false

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge and publish
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image name
        run: echo "IMAGE=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # 三个 tag 全用 raw 显式给值，不用 {{is_default_branch}} / type=ref /
          # type=sha 那套按事件类型推断的写法：
          #   - 推断规则在 push 之外的事件（schedule、workflow_dispatch、
          #     workflow_call）下行为不好断言，而 latest 一旦没打上，部署侧
          #     `docker compose pull` 就悄悄拉不到新镜像 —— 全绿的静默失败。
          #   - type=sha 用的是 github.sha（触发运行的 commit）。被复用时那不是
          #     真正构建的 commit，tag 会指向错的版本。
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ needs.build.outputs.short_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
