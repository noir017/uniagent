# Teleport agentless 接入：proxy 直接拨这个 sshd，容器里不跑 teleport。
# 用法见 README「Teleport（agentless）」。三个文件都放在 ssh/keys/（挂到 /etc/ssh/keys），不进仓库。
#
# 用户侧：信任集群的 OpenSSH CA（tctl auth export --type=openssh，去掉开头的 cert-authority）。
TrustedUserCAKeys /etc/ssh/keys/teleport_openssh_ca.pub
#
# 主机侧：Teleport 签的主机密钥和证书。10-direct.conf 里原有的主机密钥先加载，这里的排在后面：
# 同类型的密钥 sshd 取第一把给不要证书的客户端，所以只认原密钥的客户端（网关、pod 互通，
# 都带 HostKeyAlgorithms=-*-cert-v01@openssh.com）看到的指纹不变。
HostKey /etc/ssh/keys/teleport_host_key
HostCertificate /etc/ssh/keys/teleport_host_key-cert.pub
