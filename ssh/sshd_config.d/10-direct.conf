# uniagent 的直连 SSH 入口 —— 只给机器用（runabout / oraclea2）。
#
# 为什么存在：Teleport 的数据路径必然经过家里的 proxy，而 runabout 到这里直线
# 只有 1.8ms。走堡垒机是 2 次 342ms/25% 丢包的跨洋往返，每次新建 ssh 要 11-16s。
#
# ⚠ 这条路**没有** Teleport 的角色门禁、会话录制、证书过期。补偿手段全在下面：
#   - 监听只发布到宿主机的 EasyTier 地址（compose 里 10.192.168.30:30022），
#     公网和 Oracle 公有 IP 都到不了；
#   - 只认公钥，只允许 user 一个账号；
#   - 所有转发能力关掉 —— 否则这把钥匙等于一条进内网的隧道
#     （对齐原先 chatgpt 角色的 port_forwarding/forward_agent: false）。
# 人类访问请继续走堡垒机，那条路没有动。

Port 22
AddressFamily inet

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers user

AllowTcpForwarding no
AllowAgentForwarding no
GatewayPorts no
X11Forwarding no
PermitTunnel no

# 主机密钥放宿主机挂进来的 /etc/ssh/keys：重建镜像不会换指纹，
# 否则每次 rebuild 都要重写 runabout 的 known_hosts。
HostKey /etc/ssh/keys/ssh_host_ed25519_key
PidFile /run/sshd.pid

ClientAliveInterval 30
ClientAliveCountMax 4
