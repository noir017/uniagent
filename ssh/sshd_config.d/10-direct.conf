# uniagent 的直连 SSH 入口 —— 只给机器用。
#
# 为什么存在：Teleport 的数据路径要经过 proxy，机器之间频繁新建 ssh 时延迟和丢包会被放大。
#
# ⚠ 这条路**没有** Teleport 的角色门禁、会话录制、证书过期。补偿手段全在下面：
#   - 监听只发布到宿主机的内网地址（见 compose 的 ports），公网到不了；
#   - 只认公钥，只允许 user 一个账号；
#   - 所有转发能力关掉 —— 否则这把钥匙等于一条进内网的隧道。
# 人类访问请继续走 Teleport。

Port 22
AddressFamily inet

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers user

# 第二个文件是 talkcode 网关维护的 pod 互通钥匙（pod.yaml 里 peer:，见 talkcode 的
# docs/remote-hosts.md）。网关只写 ~/.talkcode/ssh/，不碰 ~/.ssh/authorized_keys。
AuthorizedKeysFile .ssh/authorized_keys .talkcode/ssh/authorized_keys

# 端口转发对「没带 restrict 的钥匙」开放 —— 也就是只有 pod 互通钥匙（ssh -L/-R 和本机 ssh 一样能用）。
# ~/.ssh/authorized_keys 里的每一把（网关的、手配的）都带 restrict，restrict 本身就关掉转发，
# 所以这一项对它们没有任何变化。往那个文件加新钥匙时照样带上 restrict，否则它也能开隧道。
# 互通钥匙限定只能从私网地址来（from=），pod 之间本来就全互信（2026-11-03 用户确认）。
AllowTcpForwarding yes
AllowAgentForwarding no
GatewayPorts no
X11Forwarding no
PermitTunnel no

# 主机密钥放宿主机挂进来的 /etc/ssh/keys：重建镜像不会换指纹，
# 否则每次 rebuild 都要重写客户端的 known_hosts。
HostKey /etc/ssh/keys/ssh_host_ed25519_key
PidFile /run/sshd.pid

ClientAliveInterval 30
ClientAliveCountMax 4
